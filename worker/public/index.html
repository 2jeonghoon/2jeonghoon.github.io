<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JH.LOG Admin</title>
  <link rel="stylesheet" href="./admin.css">
</head>
<body>
  <header class="topbar"><a href="https://2jeonghoon.github.io/">JH.LOG</a><span>Writing desk</span><button id="logout" type="button" hidden>로그아웃</button></header>
  <main id="app">
    <section id="signed-out" class="panel" hidden><p>GitHub 소유자 계정으로 로그인해 글을 관리합니다.</p><a class="button" href="/auth/login">GitHub로 로그인</a></section>
    <section id="workspace" hidden>
      <aside class="panel sidebar">
        <div class="row"><h1>글 관리</h1><button id="new-post" type="button">새 글</button></div>
        <label for="post-filter">글 상태</label>
        <select id="post-filter"><option value="all">전체</option><option value="published">발행</option><option value="draft">초안</option></select>
        <ul id="post-list" aria-live="polite"></ul>
        <section class="category-manager" aria-labelledby="category-title">
          <h2 id="category-title">카테고리</h2>
          <label for="new-parent-name">새 대분류 이름</label>
          <div class="category-add"><input id="new-parent-name" maxlength="80" autocomplete="off"><button id="add-parent-category" type="button">대분류 추가</button></div>
          <label for="child-parent">소분류의 대분류</label>
          <select id="child-parent"><option value="">대분류 선택</option></select>
          <label for="new-child-name">새 소분류 이름</label>
          <div class="category-add"><input id="new-child-name" maxlength="80" autocomplete="off"><button id="add-child-category" type="button">소분류 추가</button></div>
          <p id="category-status" role="status"></p>
        </section>
      </aside>
      <section class="panel editor">
        <form id="post-form">
          <div class="row"><h2 id="editor-title">새 글</h2><span id="save-status" role="status"></span></div>
          <label for="post-slug">슬러그</label><input id="post-slug" name="slug" required pattern="[a-z0-9]+(?:-[a-z0-9]+)*">
          <label for="post-title">제목</label><input id="post-title" name="title" maxlength="200">
          <label for="post-description">설명</label><textarea id="post-description" name="description" maxlength="600"></textarea>
          <div class="fields">
            <div><label for="post-date">날짜</label><input id="post-date" name="date" type="date"></div>
            <div><label for="post-category">대분류</label><select id="post-category" name="category" required><option value="">대분류 선택</option></select></div>
            <div><label for="post-subcategory">소분류 (선택)</label><select id="post-subcategory" name="subcategory" disabled><option value="">소분류 없음</option></select></div>
          </div>
          <label for="post-tags">태그 (쉼표 구분)</label><input id="post-tags" name="tags">
          <label for="post-image">이미지 경로</label><input id="post-image" name="image" placeholder="assets/cover.png">
          <div class="checks"><label><input id="post-featured" name="featured" type="checkbox"> 대표 글</label><label><input id="post-ai" name="aiGenerated" type="checkbox"> Agent 작성 글</label></div>
          <label for="post-body">Markdown 본문</label><textarea id="post-body" name="body" class="markdown" required></textarea>
          <div id="validation" class="error" role="alert"></div>
          <div class="actions"><button id="save-draft" type="button">초안 저장</button><button id="publish" type="button" class="primary">발행</button><button id="delete-post" type="button" class="danger" hidden>삭제</button></div>
        </form>
        <section><h2>미리보기</h2><article id="preview" class="preview"></article></section>
      </section>
    </section>
  </main>
  <dialog id="delete-dialog"><form method="dialog"><h2>글 삭제</h2><p>삭제할 슬러그를 정확히 입력하세요: <strong id="delete-slug"></strong></p><label for="delete-confirmation">슬러그 확인</label><input id="delete-confirmation" autocomplete="off"><div class="actions"><button value="cancel">취소</button><button id="confirm-delete" value="default" class="danger">삭제</button></div></form></dialog>
  <script src="./admin.js" defer></script>
</body>
</html>
