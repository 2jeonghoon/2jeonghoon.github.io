name = "jh-log-admin"
main = "src/index.mjs"
compatibility_date = "2026-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
OWNER_GITHUB_ID = "51705815"
GITHUB_OWNER = "2jeonghoon"
GITHUB_REPOSITORY = "2jeonghoon.github.io"
GITHUB_REPOSITORY_ID = "781249964"
GITHUB_BRANCH = "main"
GITHUB_APP_INSTALLATION_ID = "163976467"
ADMIN_ORIGIN = "https://jh-log-admin.2jeonghoon.workers.dev"
PUBLIC_BLOG_ORIGIN = "https://2jeonghoon.github.io"

[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "READ_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "MUTATION_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "VIEW_RATE_LIMITER"
namespace_id = "1004"
simple = { limit = 30, period = 60 }

[[d1_databases]]
binding = "ANALYTICS_DB"
database_name = "jh-log-analytics"
database_id = "d52ce794-5142-4784-a94d-4fab6277539e"
migrations_dir = "migrations"
